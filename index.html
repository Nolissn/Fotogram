<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="./styles/variables.css" />
    <link rel="stylesheet" href="./styles/standard.css" />
    <link rel="stylesheet" href="./styles/font.css" />
    <link rel="stylesheet" href="./styles/styles.css" />

    <link
      rel="icon"
      type="image/png"
      href="/assets\favicon/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="/assets\favicon/favicon.svg" />
    <link rel="shortcut icon" href="/assets\favicon/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets\favicon/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="Fotogram" />
    <link rel="manifest" href="/assets\favicon/site.webmanifest" />

    <title>Fotogram</title>
  </head>
  <body>
    <header>
      <img
        class="header_icon"
        src="./assets/svg/header_icon.svg"
        alt="Fotogram-Logo"
      />
    </header>
    <main><h1>Your personal photo album</h1></main>
    <footer>
      <!-- Dieser Abschnitt ist nur dazu da, eine responsive Kurve zu generieren, indem beim Footer Teile durch prozentuale Koordinaten ausgeschnitten werden -->
      <svg width="0" height="0">
        <clipPath id="footer_clip" clipPathUnits="objectBoundingBox">
          <path
            d="
          M 0 0.2031
          Q 0.25 0 0.5 0
          Q 0.75 0 1 0.2031
          L 1 1
          L 0 1
          Z
          "
          />
        </clipPath>
      </svg>
      <img src="./assets/svg/footer_logo.svg" alt="Developer Akademie Logo">
      <span class="footer_text">© 2023 Developer Akademie GmbH</span>
    </footer>
  </body>
</html>
