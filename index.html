<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="./styles/variables.css" />
    <link rel="stylesheet" href="./styles/standard.css" />
    <link rel="stylesheet" href="./styles/font.css" />
    <link rel="stylesheet" href="./styles/styles.css" />

    <link
      rel="icon"
      type="image/png"
      href="/assets\favicon/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="/assets\favicon/favicon.svg" />
    <link rel="shortcut icon" href="/assets\favicon/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets\favicon/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="Fotogram" />
    <link rel="manifest" href="/assets\favicon/site.webmanifest" />

    <title>Fotogram</title>
  </head>
  <body>
    <header>
      <a href="./index.html">
        <img
          class="header_icon"
          src="./assets/svg/header_icon.svg"
          alt="Fotogram-Logo"
        />
      </a>
    </header>
    <main>
      <h1>Your personal photo album</h1>
      <section class="picture_section">
        <div id="pictures_div_row_one" class="pictures_div_row_one"></div>
        <div id="pictures_div_row_two" class="pictures_div_row_two"></div>
      </section>
    </main>
    <footer>
      <!-- Dieser Abschnitt ist nur dazu da, eine responsive Kurve zu generieren, indem beim Footer Teile durch prozentuale Koordinaten ausgeschnitten werden -->
      <svg width="0" height="0">
        <clipPath id="footer_clip" clipPathUnits="objectBoundingBox">
          <path
            d="
          M 0 0.2031
          Q 0.25 0 0.5 0
          Q 0.75 0 1 0.2031
          L 1 1
          L 0 1
          Z
          "
          />
        </clipPath>
      </svg>
      <img src="./assets/svg/footer_logo.svg" alt="Developer Akademie Logo" />
      <span class="footer_text">© 2023 Developer Akademie GmbH</span>
    </footer>
    <dialog id="dialogID">
      <div class="dialog_header">
        <span class="dialog_header_text">Lorem</span>
          <img src="./assets/svg/close_x_button.svg" alt="Close Button"/>
      </div>
      <img src="./assets/pictures/black_hole.webp" alt="Selected Picture">
      <div class="dialog_footer">
        <button><img src="./assets/svg/arrow-left.svg" alt="Left Arrow Icon"></button>
        <p class="dialog_footer_text"><span class="dialog_footer_text">1</span>/12</p>
        <button><img src="./assets/svg/arrow-right.svg" alt="Right Arrow Icon"></button>
      </div>
    </dialog>
    <script src="./scripts/script.js"></script>
  </body>
</html>
